syntax = "proto3";
package aegis;

service AegisDaemon {
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream EventResponse);

  // Commands
  rpc RegisterProject(RegisterProjectRequest) returns (ProjectInfo);
  // Queues a deployment; follow it with StreamEvents or GetDeployment.
  rpc Deploy(DeployRequest) returns (DeployResponse);
  // Switches back to an earlier release; returns once it is live (or failed).
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc ControlProcess(ControlProcessRequest) returns (ProcessInfo);
  // Sets a project's daily auto-deployment time (UTC).
  rpc ConfigureSchedule(ConfigureScheduleRequest) returns (ProjectInfo);
  // Deletes an app: stops its processes, removes its domains, secrets,
  // deploy key, webhook secret, schedule and (unless kept) its releases.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  // Changes where an app's code comes from (git or a server folder).
  rpc ChangeSource(ChangeSourceRequest) returns (ProjectInfo);
  // Groups: apps deployed together from one repository and branch.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // Starts a group deployment; follow it with ListGroups.
  rpc DeployGroup(DeployGroupRequest) returns (DeployGroupResponse);
  // Puts every member of the latest group deployment back on its previous release.
  rpc RollbackGroup(RollbackGroupRequest) returns (RollbackGroupResponse);

  // Queries
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetDeployment(GetDeploymentRequest) returns (DeploymentInfo);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

message StatusRequest {}

message StatusResponse {
  bool initialized = 1;
  string version = 2;
  repeated string loaded_plugins = 3;
  uint64 event_count = 4;
  uint32 project_count = 5;
  uint32 running_processes = 6;
  string data_dir = 7;
  // Empty when the HTTP API is disabled.
  string web_url = 8;
}

message EmitEventRequest {
  string event_type = 1;
  string payload_json = 2;
}

message EmitEventResponse {
  bool success = 1;
  string event_id = 2;
}

message StreamEventsRequest {}

message EventResponse {
  string id = 1;
  string event_type = 2;
  string payload_json = 3;
  string created_at = 4;
}

message RegisterProjectRequest {
  // Reuse an existing id (e.g. from aegis.toml); a new one is generated when empty.
  string project_id = 1;
  string name = 2;
  string repository_url = 3;
  string branch = 4;
  string runtime = 5;
  // Directory deployments copy the code from.
  string source_dir = 6;
}

message ProjectInfo {
  string id = 1;
  string name = 2;
  string repository_url = 3;
  string branch = 4;
  string runtime = 5;
  string source_dir = 6;
  string current_release = 7;
  string created_at = 8;
  // Present once the project has been deployed.
  optional ProcessInfo process = 9;
  // Latest resource sample, while the app runs. Older daemons leave it unset.
  optional ResourceUsage usage = 10;
  // Every instance serving the live release, in instance order (one for
  // single-instance apps; `process` is the first). Older daemons send none.
  repeated ProcessInfo instances = 11;
  // After a BlueGreen switch: the previous release, still running as an
  // instant rollback target until `standby_until` (RFC 3339). Empty otherwise.
  string standby_version = 12;
  string standby_until = 13;
}

message ResourceUsage {
  // CPU used since the previous sample, in cores (1.0 = one full core).
  double cpu_cores = 1;
  uint64 memory_bytes = 2;
  optional double cpu_limit_cores = 3;
  optional uint64 memory_limit_bytes = 4;
  // Unix milliseconds when the sample was taken.
  int64 sampled_at = 5;
}

message DeployRequest {
  // Project id or name.
  string project = 1;
  string branch = 2;
  // GracefulSwitch, Immediate, Rolling or BlueGreen; empty for the
  // project's default. Rolling and BlueGreen need the built-in proxy.
  string strategy = 3;
  // Copy code from this directory (takes precedence over repository_url).
  string source_dir = 4;
  string repository_url = 5;
  string commit = 6;
  // Release name; generated from the current time when empty.
  string version = 7;
}

message DeployResponse {
  string deployment_id = 1;
  string project_id = 2;
  string project_name = 3;
}

message RollbackRequest {
  string project = 1;
  // Defaults to the release that was live before the current one.
  string version = 2;
}

message RollbackResponse {
  string version = 1;
}

enum ProcessAction {
  PROCESS_ACTION_UNSPECIFIED = 0;
  PROCESS_ACTION_START = 1;
  PROCESS_ACTION_STOP = 2;
  PROCESS_ACTION_RESTART = 3;
}

message ControlProcessRequest {
  // Process id, or a project id/name meaning its current process.
  string target = 1;
  ProcessAction action = 2;
}

message ProcessInfo {
  string id = 1;
  string project_id = 2;
  optional uint32 pid = 3;
  string status = 4;
  string desired = 5;
  uint32 restart_count = 6;
  string release_version = 7;
  string command = 8;
  string last_start = 9;
  optional int32 last_exit_code = 10;
  // Instance number (1-based) when the app runs several instances.
  optional uint32 instance = 11;
  // The port the process listens on (its PORT).
  optional uint32 port = 12;
  // Latest CPU (cores) and memory (bytes) of this process, while it runs.
  optional double cpu_cores = 13;
  optional uint64 memory_bytes = 14;
}

message ConfigureScheduleRequest {
  string project = 1;
  uint32 hour = 2;
  uint32 minute = 3;
  // Defaults to the project's branch.
  string branch = 4;
}

message DeleteProjectRequest {
  // Project id or name.
  string project = 1;
  // Keep the release directories and logs on disk.
  bool keep_releases = 2;
}

message DeleteProjectResponse {
  string project_id = 1;
  string name = 2;
  uint32 stopped_processes = 3;
  repeated string domains = 4;
  uint64 secrets_removed = 5;
  bool releases_kept = 6;
  // Where the kept releases are (keep_releases).
  string kept_dir = 7;
}

message ChangeSourceRequest {
  // Project id or name.
  string project = 1;
  // A git repository, or...
  string repository_url = 2;
  string branch = 3;
  // ...a folder on the server.
  string source_dir = 4;
  // Build and run only this folder of the source.
  string source_subdir = 5;
}

message ListGroupsRequest {}

message GroupMemberInfo {
  string project_id = 1;
  string name = 2;
  repeated string watch_paths = 3;
  string current_release = 4;
  // In the latest group deployment: pending, deploying, deployed, skipped,
  // failed or rolled_back (empty when not part of it).
  string last_status = 5;
  string last_version = 6;
  string last_reason = 7;
}

message GroupInfo {
  string id = 1;
  string name = 2;
  string repository_url = 3;
  string branch = 4;
  bool rollback_on_failure = 5;
  repeated GroupMemberInfo members = 6;
  // The latest group deployment (empty when there is none).
  string last_deployment_id = 7;
  // Running, Success, Failed or RolledBack.
  string last_status = 8;
  string last_commit = 9;
  string last_error = 10;
}

message ListGroupsResponse {
  repeated GroupInfo groups = 1;
}

message DeployGroupRequest {
  // Group id or name.
  string group = 1;
  // Default: the branch's latest commit.
  string commit = 2;
  // Deploy every member, not only those with changes.
  bool all = 3;
}

message DeployGroupResponse {
  string group_deployment_id = 1;
  string group_id = 2;
}

message RollbackGroupRequest {
  string group = 1;
}

message MemberRollbackInfo {
  string name = 1;
  // The release now live; empty when the app was stopped or the rollback failed.
  string version = 2;
  string error = 3;
}

message RollbackGroupResponse {
  repeated MemberRollbackInfo members = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated ProjectInfo projects = 1;
}

message ListReleasesRequest {
  string project = 1;
}

message ReleaseInfo {
  string id = 1;
  string version = 2;
  string status = 3;
  string commit_sha = 4;
  string commit_message = 5;
  string checksum = 6;
  string created_at = 7;
}

message ListReleasesResponse {
  repeated ReleaseInfo releases = 1;
}

message ListDeploymentsRequest {
  // Empty for all projects.
  string project = 1;
}

message DeploymentInfo {
  string id = 1;
  string project_id = 2;
  string version = 3;
  string strategy = 4;
  string status = 5;
  string stage = 6;
  string error = 7;
  string trigger = 8;
  string created_at = 9;
  string completed_at = 10;
}

message ListDeploymentsResponse {
  repeated DeploymentInfo deployments = 1;
}

message GetDeploymentRequest {
  string deployment_id = 1;
}

message ListProcessesRequest {
  string project = 1;
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message GetLogsRequest {
  // Process id or project id/name.
  string target = 1;
  uint32 lines = 2;
}

message LogLine {
  string timestamp = 1;
  // "out", "err" or "sys" (messages from the supervisor).
  string stream = 2;
  string line = 3;
}

message GetLogsResponse {
  string process_id = 1;
  repeated LogLine lines = 2;
}

message StreamLogsRequest {
  string target = 1;
  // Lines of history to send before following.
  uint32 lines = 2;
}

message ListEventsRequest {
  string project = 1;
  // Most recent events to return (default 50).
  uint32 limit = 2;
  // Return every matching event, oldest first; limit is ignored.
  bool all = 3;
}

message ListEventsResponse {
  repeated EventResponse events = 1;
}
