[package]
name = "aegis-ingress"
version = "0.1.0"
edition = "2021"
description = "Built-in reverse proxy: routes domains to apps, with automatic HTTPS"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
aegis-types = { path = "../../core/types" }

[dev-dependencies]
tempfile = { workspace = true }
