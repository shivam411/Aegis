name: Performance

# Benchmarks and soak tests. See docs/benchmarks.md.
#
# - Benchmarks: every PR to main and every push to main. Results are compared
#   with the latest main run (restored from the Actions cache) and regressions
#   beyond the threshold are flagged in the job summary and as warnings. They
#   don't fail the build unless the repository variable
#   BENCH_FAIL_ON_REGRESSION is "true" (threshold: BENCH_REGRESSION_THRESHOLD,
#   default 0.30 = 30% slower).
# - Short soak (5 min): every push to main, and PRs labelled `soak`.
# - Long soak (60 min): nightly, or on demand with any duration.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Soak duration in minutes (0 = no soak; at most 300)
        default: '60'
        type: string
      benchmarks:
        description: Run the benchmarks too
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

# One run per ref and kind of trigger; newer pushes to a PR cancel older runs.
# Adding a label gets its own group so it doesn't cancel the PR's benchmarks.
concurrency:
  group: perf-${{ github.event_name }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Benchmarks
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.benchmarks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: perf-bench

      - name: Restore the main baseline
        id: baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench-baseline
          key: bench-baseline-main-${{ github.run_id }}
          restore-keys: bench-baseline-main-

      - name: Build benchmarks
        run: cargo bench -p aegis-benchmarks --no-run

      - name: Criterion benchmarks (event pipeline, proxy overhead)
        run: |
          cargo bench -p aegis-benchmarks --bench event_throughput --bench proxy_overhead -- \
            --warm-up-time 1 --measurement-time 4 --noplot

      - name: Deploy saga timings (tiny app, real processes)
        env:
          AEGIS_BENCH_DEPLOYS: '8'
        run: cargo bench -p aegis-benchmarks --bench deploy_saga

      - name: Report and compare with main
        env:
          THRESHOLD: ${{ vars.BENCH_REGRESSION_THRESHOLD || '0.30' }}
          FAIL_ON_REGRESSION: ${{ vars.BENCH_FAIL_ON_REGRESSION || 'false' }}
        run: |
          mkdir -p bench-out
          flags=(--threshold "$THRESHOLD" --github-annotations)
          [ "$FAIL_ON_REGRESSION" = true ] && flags+=(--fail-on-regression)
          set +e
          python3 scripts/bench_report.py \
            --criterion-dir target/criterion \
            --extra target/bench-results/deploy_saga.json \
            --baseline bench-baseline/bench-results.json \
            --out-json bench-out/bench-results.json \
            --out-md bench-out/bench-report.md \
            "${flags[@]}"
          status=$?
          set -e
          cat bench-out/bench-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench-out/
            target/criterion/
            target/bench-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Keep as the new main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p bench-baseline
          cp bench-out/bench-results.json bench-baseline/bench-results.json

      - name: Save the main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bench-baseline
          key: bench-baseline-main-${{ github.run_id }}

  soak:
    name: Soak (${{ github.event_name == 'schedule' && '60' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes || '5') }} min)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0') ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'soak') &&
        (github.event.action != 'labeled' || github.event.label.name == 'soak'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || (github.event_name == 'schedule' && 110 || 45) }}
    env:
      DURATION_MIN: ${{ github.event_name == 'schedule' && '60' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes || '5') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the duration
        run: |
          case "$DURATION_MIN" in ''|*[!0-9]*) echo "soak_minutes must be a whole number"; exit 1 ;; esac
          [ "$DURATION_MIN" -le 300 ] || { echo "soak_minutes is at most 300"; exit 1; }

      - name: Lint the soak scripts
        run: |
          shellcheck scripts/soak.sh
          python3 -m py_compile scripts/soak_load.py scripts/soak_report.py scripts/bench_report.py

      - name: Set up Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: perf-soak

      - name: Build the daemon (release)
        run: cargo build --release -p aegis-daemon

      - name: Soak
        # As root, so the daemon can enforce cgroup limits (the limit-change
        # operations are skipped otherwise). The report lands in soak-report/.
        run: |
          sudo -E env "PATH=$PATH" BIN_DIR=target/release OUT_DIR=soak-report \
            DURATION_MIN="$DURATION_MIN" scripts/soak.sh

      - name: Soak report
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" soak-report 2>/dev/null || true
          if [ -f soak-report/report.md ]; then
            cat soak-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Soak test: no report (the script stopped early; see the log)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 soak-report/daemon.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-report-${{ env.DURATION_MIN }}min-${{ github.run_id }}
          path: soak-report/
          retention-days: 30
          if-no-files-found: warn
