name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  release:
    types: [published]
  workflow_dispatch:

# Builds need no write access; only the release job below can publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails in seconds, before the long builds, when releases can't be signed
  # yet. The release job checks again and does the signing.
  signing-key:
    name: Release signing key is set up
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secret and the committed public key
        env:
          HAS_SECRET: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if [ "${HAS_SECRET}" != true ]; then
            echo "::error title=Release signing key missing::The MINISIGN_SECRET_KEY secret is not set, so this release can't be signed and will NOT be published. Aegis installs only signed releases. Follow docs/releasing.md (One-time setup), then re-run this workflow."
            exit 1
          fi
          if ! grep -vE '^[[:space:]]*(#|untrusted comment:|$)' core/update/keys/release.pub | grep -q .; then
            echo "::error title=No release public key committed::core/update/keys/release.pub is still the placeholder. Commit the public key (docs/releasing.md) before releasing."
            exit 1
          fi
          echo "Signing key secret present; trusted keys:"
          grep -vE '^[[:space:]]*(#|untrusted comment:|$)' core/update/keys/release.pub

  build:
    name: Build ${{ matrix.target }}
    needs: signing-key
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aegis-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aegis-linux-arm64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: aegis-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: aegis-darwin-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: aegis-windows-amd64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # The binaries report this version (`aegis-daemon --version`, the
      # dashboard, update checks). Without it they would report the crate
      # version, and self-update would offer the same release forever.
      - name: Version from the tag
        shell: bash
        env:
          REF: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${REF#[vV]}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "AEGIS_VERSION=${version}" >> "$GITHUB_ENV"
            echo "Building Aegis ${version}"
          else
            echo "::warning::'${REF}' is not a version tag; the binaries report the crate version"
          fi

      # Install cross-compilation tools for ARM64 Linux
      - name: Install cross (ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Build
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        # Cross.toml passes AEGIS_VERSION into the build container.
        run: cross build --release --target ${{ matrix.target }}

      - name: Check the reported version
        if: "!matrix.cross && env.AEGIS_VERSION != ''"
        shell: bash
        run: |
          out="$(target/${{ matrix.target }}/release/aegis-daemon --version)"
          echo "${out}"
          [ "${out}" = "aegis-daemon ${AEGIS_VERSION}" ]

      # Package — Linux/macOS
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          for bin in aegis-daemon aegis-cli aegis-tui; do
            if [ -f "target/${{ matrix.target }}/release/${bin}" ]; then
              cp "target/${{ matrix.target }}/release/${bin}" dist/
            fi
          done
          cd dist
          tar -czf "../${{ matrix.archive }}" *

      # Package — Windows
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          foreach ($bin in @("aegis-daemon.exe", "aegis-cli.exe", "aegis-tui.exe")) {
            $src = "target/${{ matrix.target }}/release/$bin"
            if (Test-Path $src) {
              Copy-Item $src -Destination dist/
            }
          }
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Sign and Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write: it creates the release and its assets.
    permissions:
      contents: write
    # Holds MINISIGN_SECRET_KEY / MINISIGN_PASSWORD (repository secrets work
    # too); add required reviewers to it for a manual gate. docs/releasing.md
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Every Aegis installer (dashboard, update helper, `aegis upgrade`,
      # `aegis-daemon self-update`, install.sh) refuses a release whose
      # SHA256SUMS isn't signed by a key in core/update/keys/release.pub.
      # So without the key nothing is published (the step fails) rather
      # than publishing a release nobody can install.
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error title=Release signing key missing::The MINISIGN_SECRET_KEY secret is not set, so this release can't be signed and was NOT published. Aegis installs only signed releases. Create the key and the secrets as described in docs/releasing.md (One-time setup), then re-run this workflow."
            exit 1
          fi
          if ! grep -vE '^[[:space:]]*(#|untrusted comment:|$)' core/update/keys/release.pub | grep -q .; then
            echo "::error title=No release public key committed::core/update/keys/release.pub is still the placeholder: Aegis builds from this commit can't verify any release. Commit the public key (docs/releasing.md) before releasing."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          umask 077
          key="${RUNNER_TEMP}/aegis-release.key"
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key}"
          # minisign reads the key's password from stdin (none for a key
          # made with -W).
          printf '%s\n' "${MINISIGN_PASSWORD}" | minisign -S -s "${key}" \
            -m release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig \
            -t "aegis-release:${TAG} file:SHA256SUMS"
          rm -f "${key}"
          cat release-assets/SHA256SUMS.minisig

      # The signature must verify with the committed public keys, both with
      # minisign and with install.sh's own OpenSSL-based check.
      - name: Verify the signature
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          verified=0
          while read -r key; do
            if minisign -V -P "${key}" -m release-assets/SHA256SUMS -x release-assets/SHA256SUMS.minisig; then
              verified=1
            fi
          done < <(grep -vE '^[[:space:]]*(#|untrusted comment:|$)' core/update/keys/release.pub)
          if [ "${verified}" != 1 ]; then
            echo "::error title=Signature does not match the committed key::SHA256SUMS.minisig does not verify with any key in core/update/keys/release.pub. Is MINISIGN_SECRET_KEY the secret half of a committed key? Nothing was published."
            exit 1
          fi
          AEGIS_INSTALL_SH_LIB=1 bash -c 'set -euo pipefail; source ./install.sh; verify_release_signature release-assets "$1"' check "${TAG}"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
