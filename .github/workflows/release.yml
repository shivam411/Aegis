name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aegis-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aegis-linux-arm64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: aegis-darwin-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: aegis-darwin-arm64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: aegis-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Install cross-compilation tools for ARM64 Linux
      - name: Install cross (ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Build
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      # Package — Linux/macOS
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          for bin in aegis-daemon aegis-cli aegis-tui; do
            if [ -f "target/${{ matrix.target }}/release/${bin}" ]; then
              cp "target/${{ matrix.target }}/release/${bin}" dist/
            fi
          done
          cd dist
          tar -czf "../${{ matrix.archive }}" *

      # Package — Windows
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          foreach ($bin in @("aegis-daemon.exe", "aegis-cli.exe", "aegis-tui.exe")) {
            $src = "target/${{ matrix.target }}/release/$bin"
            if (Test-Path $src) {
              Copy-Item $src -Destination dist/
            }
          }
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
