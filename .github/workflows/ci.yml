name: Aegis CI & Automated Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

# A newer push to the same PR makes older runs pointless; runs on main are
# kept so every merged commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: Check, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docker for container-app tests
        # GitHub's Ubuntu runners ship Docker. The container-app integration
        # test (core/control/tests/docker.rs) would skip itself without it;
        # AEGIS_REQUIRE_DOCKER below makes that a failure here instead.
        run: docker version

      - name: Run unit and integration tests
        env:
          AEGIS_REQUIRE_DOCKER: '1'
        run: cargo test --workspace --all-targets

      - name: Resource limits against the real kernel (cgroup v2)
        # The cgroup tests skip themselves where limits are unusable (as in
        # the unprivileged run above); AEGIS_REQUIRE_CGROUPS=1 makes that a
        # failure here. CPU caps read back from cpu.max, live limit changes,
        # OOM kills and restarts, enforced by the runner's kernel. Each test
        # binary runs twice, once per way the daemon finds its cgroups:
        #  1. delegated: as the unprivileged runner user in a transient
        #     systemd service with Delegate=yes, as install.sh --server sets
        #     up (apps under <service cgroup>/apps);
        #  2. as root via sudo from this job, whose cgroup belongs to the
        #     runner's own systemd service (/sys/fs/cgroup/aegis).
        # Each run must also report the expected cgroup location.
        shell: bash
        env:
          AEGIS_REQUIRE_CGROUPS: '1'
        run: |
          echo "cgroup of this job: $(cat /proc/self/cgroup)"
          echo "root controllers: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          for spec in "aegis-resources kernel" "aegis-web resources"; do
            set -- $spec
            cargo test -p "$1" --test "$2" --no-run --message-format=json \
              | jq -r 'select(.profile.test == true and .executable != null)
                       | [.executable, (.manifest_path | sub("/Cargo.toml$"; ""))] | @tsv'
          done > "$RUNNER_TEMP/cgroup-tests"
          cat "$RUNNER_TEMP/cgroup-tests"
          out="$RUNNER_TEMP/cgroup-test-output"
          while IFS=$'\t' read -r bin dir; do
            echo "::group::$(basename "$bin"): delegated systemd service, user $(id -un)"
            sudo systemd-run --quiet --wait --pipe --collect \
              --uid="$(id -u)" --gid="$(id -g)" -p Delegate=yes \
              --working-directory="$dir" \
              -E AEGIS_REQUIRE_CGROUPS=1 -E PATH="$PATH" -E HOME="$HOME" \
              "$bin" --nocapture --test-threads=1 2>&1 | tee "$out"
            grep -Eq 'cgroups: "?cgroup2"? at "?/sys/fs/cgroup/.*\.service/apps' "$out" \
              || { echo "::error::$(basename "$bin") did not use the delegated service cgroup"; exit 1; }
            echo "::endgroup::"
            echo "::group::$(basename "$bin"): root (sudo)"
            (cd "$dir" && sudo -E "$bin" --nocapture --test-threads=1) 2>&1 | tee "$out"
            grep -Eq 'cgroups: "?cgroup2"? at "?/sys/fs/cgroup/aegis' "$out" \
              || { echo "::error::$(basename "$bin") did not use /sys/fs/cgroup/aegis"; exit 1; }
            echo "::endgroup::"
          done < "$RUNNER_TEMP/cgroup-tests"

      - name: Check performance benchmark compilation
        run: cargo check --benches

  cross-platform-build:
    name: Build (${{ matrix.target.os }})
    needs: check-and-test
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - os: ubuntu-latest
            artifact_name: aegis-linux-amd64
          - os: macos-latest
            artifact_name: aegis-darwin-arm64
          - os: windows-latest
            artifact_name: aegis-windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace binaries
        run: cargo build --workspace --release

      - name: Verify compiled binaries
        shell: bash
        run: |
          ls -la target/release/aegis* || true

  auto-deploy-test:
    name: Automated Deployment Validation
    needs: [check-and-test, cross-platform-build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Set up Node.js (for examples/node-app)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Aegis Daemon & CLI
        run: cargo build --release -p aegis-daemon -p aegis-cli

      - name: End-to-end deployment scenarios
        # Deploys examples/node-app and checks redeploy, stop/start/restart,
        # failed builds, auto-rollback of unhealthy releases, manual rollback
        # and daemon restarts against the real binaries.
        run: BIN_DIR=target/release scripts/e2e-smoke.sh

      - name: Install dashboard test dependencies
        working-directory: ui-tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Dashboard browser tests
        # Drives the web dashboard in Chromium against the same release
        # build: sign-in, new-app wizard, live deploy pipeline, logs,
        # process control, rollback, timeline, audit log, API tokens, CPU
        # and memory sliders (a busy loop capped, an OOM kill restarted),
        # and a phone-sized viewport. Any CSP violation or script error
        # fails it. Run as root so the daemon can manage cgroups
        # (/sys/fs/cgroup/aegis); AEGIS_REQUIRE_CGROUPS makes the resource
        # test fail rather than skip its limit steps if it can't.
        working-directory: ui-tests
        env:
          BIN_DIR: target/release
          CI: 'true'
          AEGIS_REQUIRE_CGROUPS: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: sudo -E env "PATH=$PATH" npx playwright test

      - name: Upload dashboard test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results
            ui-tests/.work/daemon.log
          retention-days: 7
