name: Aegis CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    name: Check, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Check performance benchmark compilation
        run: cargo check --benches

  cross-platform-build:
    name: Build (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - os: ubuntu-latest
            artifact_name: aegis-linux-amd64
          - os: macos-latest
            artifact_name: aegis-darwin-arm64
          - os: windows-latest
            artifact_name: aegis-windows-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace binaries
        run: cargo build --workspace --release

      - name: Verify compiled binaries
        shell: bash
        run: |
          ls -la target/release/aegis* || true
