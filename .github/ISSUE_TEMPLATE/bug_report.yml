name: Bug Report
description: Create a report to help us fix a bug in Aegis
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      description: e.g., Ubuntu 22.04 LTS (x86_64), macOS Sonoma (arm64), Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aegis Version (`aegis status`)
      description: e.g., v0.3.0-mlp
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal / Daemon Logs
      description: Output from `aegis events` or daemon tracing logs.
