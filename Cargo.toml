[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/daemon",
    "apps/tui",
    "crates/deployment",
    "crates/process",
    "crates/git",
    "crates/analytics",
    "crates/logs",
    "crates/metrics",
    "crates/ssh",
    "crates/health",
    "crates/event_store",
    "crates/plugins",
    "crates/config",
    "crates/auth",
    "crates/secrets",
    "crates/notifications",
    "crates/scheduler",
    "crates/api",
]

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
futures-core = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# gRPC & Protocol Buffers
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3.0.0"

# CLI Parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (SQLx + SQLite)
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }

# Core Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tempfile = "3.10"
